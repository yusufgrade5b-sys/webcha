<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Daftar Akun Baru</h2>

        <form id="registerForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Buat username baru" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Masukkan email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Buat password" required>
            </div>

            <button type="submit">Daftar</button>
        </form>

        <p>Sudah punya akun? <a href="index.html">Login di sini</a></p>
    </div>

    <!-- ☝️ INI YANG PALING PENTING - JANGAN LUPA! -->
    <script src="js/register.js"></script>
</body>
</html>
