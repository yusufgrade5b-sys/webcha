<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Register - Ruang Teduh</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<section class="h-100">
		<div class="container h-100">
			<div class="row justify-content-sm-center h-100">
				<div class="col-xxl-4 col-xl-5 col-lg-5 col-md-7 col-sm-9">
					<div class="text-center my-5">
						<h2 class="fw-bold">RUANG TEDUH</h2>
					</div>
					<div class="card shadow-lg">
						<div class="card-body p-5">
							<h1 class="fs-4 card-title fw-bold mb-4">Create Account</h1>
							
							<form id="formRegistrasi" autocomplete="off">
								<div class="mb-3">
									<label class="mb-2 text-muted" for="regName">Name</label>
									<input id="regName" type="text" class="form-control" required autofocus>
								</div>

								<div class="mb-3">
									<label class="mb-2 text-muted" for="regEmail">E-Mail Address</label>
									<input id="regEmail" type="email" class="form-control" required>
								</div>

								<div class="mb-3">
									<label class="mb-2 text-muted" for="regPassword">Password</label>
									<input id="regPassword" type="password" class="form-control" required>
								</div>

								<div class="align-items-center d-flex mt-4">
									<button type="submit" class="btn btn-primary ms-auto">
										Daftar Sekarang
									</button>
								</div>
							</form>
						</div>
						<div class="card-footer py-3 border-0">
							<div class="text-center">
								Sudah punya akun? <a href="index.html" class="text-dark">Login</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<script>
		// Sesuai LKPD: Menggunakan Javascript Objek untuk Register
		document.getElementById('formRegistrasi').addEventListener('submit', function(e) {
			e.preventDefault(); // Mencegah reload halaman

			// 1. Ambil data dari input
			const namaUser = document.getElementById('regName').value;
			const emailUser = document.getElementById('regEmail').value;
			const passUser = document.getElementById('regPassword').value;

			// 2. Simpan ke LocalStorage (Simulasi Database sesuai LKPD)
			localStorage.setItem("userTerdaftar", namaUser);
			localStorage.setItem("emailTerdaftar", emailUser);
			localStorage.setItem("passwordTerdaftar", passUser);

			// 3. Tampilkan Alert (Tujuan Kegiatan No. 3)
			alert("Akun berhasil dibuat! Silakan login dengan akun tersebut.");

			// 4. Arahkan ke halaman login
			window.location.href = "index.html"; 
		});
	</script>
</body>
</html>
